<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-title" content="Pedidos Bel">
<title>Panel de pedidos · Bel Personal Shopper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../assets/icono-bel-64.png">
<link rel="apple-touch-icon" href="../assets/icono-bel-180.png">
<link rel="stylesheet" href="../assets/envios.css">
<style>
  /* Entrada */
  .login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(120% 70% at 50% 0%,var(--pink-100),transparent 70%),radial-gradient(80% 50% at 100% 100%,var(--gold-100),transparent 70%),var(--bg)}
  .login form{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
  .login .logo{width:88px;height:88px;margin:0 auto;border-radius:22px;background:#fff;box-shadow:0 0 0 1px var(--line)}
  .login h1{color:var(--pink-700);text-align:center;font-size:1.6rem}
  .login .acceso{text-align:center;color:var(--muted);font-size:.9rem}

  /* Panel compacto */
  body{font-size:14px}
  .btn-sm{min-height:36px;padding:6px 12px;font-size:.86rem;border-radius:10px}
  .btn.ico{min-width:36px;padding:6px 8px}
  .top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
  .top::before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--brand),var(--pink-300) 55%,var(--gold))}
  .top-in{max-width:1280px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .top .marca img{width:34px;height:34px;border-radius:10px}
  .top .marca b{font-size:1rem}
  .top .marca small{font-size:.6rem}
  .tabs{display:flex;background:var(--pink-50);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
  .tabs button{border:0;background:transparent;border-radius:9px;padding:6px 14px;font-weight:600;font-size:.88rem;color:var(--muted);cursor:pointer;min-height:32px;white-space:nowrap}
  .tabs button[aria-current="page"]{background:var(--surface);color:var(--pink-700);box-shadow:0 1px 3px rgba(122,13,66,.15)}
  .acciones{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:auto}
  .wrap{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px}
  .vista{display:flex;flex-direction:column;gap:10px}
  .vista[hidden]{display:none!important}

  /* Próximo envío */
  .proximo{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--gold-300);background:linear-gradient(90deg,var(--gold-100),var(--surface));border-radius:12px;padding:8px 12px;cursor:pointer;font-size:.9rem;color:var(--fg)}
  .proximo i{width:30px;height:30px;border-radius:9px;background:var(--surface);color:var(--pink-600);display:grid;place-items:center;flex:0 0 auto}
  .proximo i svg{width:18px;height:18px}
  .proximo .tx{flex:1;display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;min-width:0}
  .proximo .m{color:var(--muted)}
  .proximo .alerta{color:var(--pink-700);font-weight:700;background:none;padding:0;font-size:inherit}
  .proximo .ver{color:var(--pink-700);font-weight:700}
  .proximo.vacio{cursor:default;background:var(--surface);border-style:dashed}
  .proximo.vacio span{margin-right:auto;color:var(--muted)}

  /* Resumen */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .stat{padding:8px 14px;display:flex;flex-direction:column;border-left:1px solid var(--line)}
  .stat:first-child{border-left:0}
  .stat span{color:var(--muted);font-size:.76rem}
  .stat b{font-family:var(--display);font-size:1.25rem;line-height:1.2;font-variant-numeric:tabular-nums}
  .stat.y{background:var(--gold-100);color:var(--gold-ink)}
  .stat.y span{color:inherit}

  /* Filtros */
  .filters{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:6px}
  .filters input,.filters select{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:16px;min-height:38px;width:100%}
  .b-filtros{display:none}

  /* Tabla */
  .table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.82rem}
  th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--pink-700);font-weight:700;background:var(--pink-50);position:sticky;top:0}
  td.cod{font-weight:700;color:var(--pink-700)}
  td.cli small{display:block;color:var(--muted);font-size:.74rem}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--pink-50)}
  tbody tr:last-child td{border-bottom:0}
  .pill{font-size:.68rem;padding:2px 8px}
  .sal{display:inline-block;background:var(--gold-100);color:var(--gold-ink);border-radius:999px;padding:2px 8px;font-size:.72rem;font-weight:700;white-space:nowrap}
  .nada{color:var(--muted)}
  .debe{color:var(--pink-700);font-weight:700}
  .pagado{color:var(--ok);font-weight:600}
  .empty{padding:20px;text-align:center;color:var(--muted)}

  /* Lista en móvil */
  .list{display:none;flex-direction:column;gap:6px}
  .item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;cursor:pointer;font-size:.88rem}
  .item .r{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .item .nom{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .cod{color:var(--pink-700)}
  .item .chips{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
  .item small{color:var(--muted);white-space:nowrap}
  .item .debe,.item .pagado{white-space:nowrap;font-size:.84rem}

  /* Pedidos nuevos */
  .aviso-nuevos{background:var(--yellow-300);color:var(--yellow-ink);border:0}
  tr.nuevo td:first-child{box-shadow:inset 3px 0 0 var(--pink-600)}
  tr.nuevo{background:var(--yellow-100)}
  .item.nuevo{border-color:var(--pink-300);box-shadow:inset 3px 0 0 var(--pink-600)}
  .tag-nuevo{background:var(--pink-600);color:var(--on-accent);border-radius:999px;padding:1px 7px;font-size:.66rem;font-weight:700;margin-left:6px;vertical-align:middle}

  /* Fechas de envío */
  .fechas-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
  .fechas-top h2{font-size:1.35rem}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
  .fcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--fg)}
  .fcard:hover{border-color:var(--pink-300)}
  .fcard.cerrada{background:var(--bg)}
  .fcard .r{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .fcard .dia b{display:block;font-family:var(--display);font-size:1.3rem;color:var(--pink-700);line-height:1.1}
  .fcard .dia small{color:var(--muted);font-size:.78rem}
  .fcard .met{display:flex;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
  .fcard .met b{color:var(--fg)}
  .fcard .met .debe b{color:var(--pink-700)}
  .alerta{background:var(--yellow-100);color:var(--yellow-ink);border-radius:8px;padding:4px 8px;font-size:.78rem;font-weight:600}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .kpis div{background:var(--pink-50);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column}
  .kpis div.y{background:var(--gold-100);color:var(--gold-ink)}
  .kpis span{font-size:.7rem;color:var(--muted)}
  .kpis .y span{color:inherit}
  .kpis b{font-variant-numeric:tabular-nums;font-size:.95rem}
  .fps{display:flex;flex-direction:column;gap:6px}
  .fp{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
  .fp .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .fp .r small{color:var(--muted)}
  .fp .r .debe,.fp .r .pagado{margin-left:auto;font-size:.85rem}
  .lnk{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--fg);font-size:.92rem}
  .lnk b{color:var(--pink-700)}
  .cands{display:flex;flex-direction:column;gap:4px;max-height:320px;overflow-y:auto}
  .cand{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
  .cand input{width:20px;height:20px;accent-color:var(--pink-600);flex:0 0 auto;margin-top:1px}
  .cand small{display:block;color:var(--muted);font-size:.76rem}
  .cand:has(input:checked){border-color:var(--pink-300);background:var(--pink-50)}
  .peligro{color:var(--danger)}

  /* Detalle */
  .overlay{position:fixed;inset:0;background:rgba(42,27,34,.35);z-index:20}
  .panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:21;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.12);display:flex;flex-direction:column}
  .panel-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;display:flex;align-items:center;gap:8px;z-index:1}
  .panel-head h2{margin-right:auto;font-size:1.15rem;color:var(--pink-700)}
  .panel-head img{width:30px;height:30px;border-radius:9px;background:#fff;box-shadow:0 0 0 1px var(--line)}
  .panel-body{padding:12px;display:flex;flex-direction:column;gap:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
  .sec h3{font-size:1rem;color:var(--pink-700);display:flex;align-items:center;gap:8px}
  .sec h3::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
  .field{gap:4px}
  .field label{font-size:.8rem}
  .field input,.field select,.field textarea{min-height:40px;padding:8px 10px;border-radius:10px}
  .field textarea{min-height:64px}
  .totals{background:var(--gold-100);border:1px solid var(--gold-300);color:var(--gold-ink);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums;font-size:.9rem}
  .totals div{display:flex;justify-content:space-between}
  .totals .big{font-weight:700;border-top:1px dashed var(--gold-300);padding-top:4px;margin-top:2px}
  .btns{display:flex;flex-wrap:wrap;gap:6px}
  .btns.g2{display:grid;grid-template-columns:1fr 1fr}
  .hist{display:flex;flex-direction:column;gap:6px;font-size:.82rem;max-height:220px;overflow-y:auto}
  .hist div{border-bottom:1px solid var(--line);padding-bottom:6px;overflow-wrap:anywhere}
  .hist small{color:var(--muted)}
  .addr{white-space:pre-line;background:var(--pink-50);border-radius:10px;padding:8px 12px;font-size:.88rem}
  dialog{border:1px solid var(--line);border-radius:16px;padding:18px;width:min(420px,calc(100% - 32px));background:var(--surface);color:var(--fg)}
  dialog::backdrop{background:rgba(42,27,34,.35)}
  dialog form{display:flex;flex-direction:column;gap:12px}

  /* Productos del pedido */
  .nota-tax{background:var(--yellow-100);color:var(--yellow-ink);border-radius:10px;padding:6px 10px;font-size:.84rem}
  .prods{display:flex;flex-direction:column;gap:8px}
  .prod{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:1fr 64px 104px;gap:6px;align-items:end}
  .prod .desc{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;overflow-wrap:anywhere;font-size:.9rem}
  .prod .desc a{color:var(--pink-700)}
  .prod .sub{grid-column:1/2;font-variant-numeric:tabular-nums;font-weight:600;align-self:center;font-size:.88rem}
  .prod .acc{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
  .prod input{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 8px;font-size:16px;min-height:38px;width:100%}
  .prod label{font-size:.74rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
  .add-prod{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
  .add-prod .full{grid-column:1/-1}
  .field input[readonly]{background:var(--pink-50);color:var(--muted)}
  .hint{font-size:.78rem;color:var(--muted)}
  .btn-wa{background:#1F8F4E;color:#fff;border:0}
  .pie{max-width:1280px;margin:0 auto;padding:4px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
  .pie .corona{max-width:280px;width:100%;margin:0 auto}
  .pie .lema{font-size:.64rem}

  /* Etiqueta de envío: blanco y negro, apta para impresoras térmicas */
  #etiquetas-print{position:fixed;left:-10000px;top:0;visibility:hidden;pointer-events:none}
  .et{box-sizing:border-box;overflow:hidden;background:#fff;color:#000;font-family:"Work Sans",Arial,sans-serif;line-height:1.25;display:flex;flex-direction:column;gap:.35em;transform-origin:top left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .et-top{display:flex;align-items:center;gap:.5em;border-bottom:.14em solid #000;padding-bottom:.4em}
  .et-top img{width:2.4em;height:2.4em;border-radius:.4em;filter:grayscale(1) contrast(1.4)}
  .et-marca{display:flex;flex-direction:column;min-width:0;flex:1}
  .et-marca b{font-size:.85em}
  .et-marca small{font-size:.65em}
  .et-cod{font-size:1.25em;border:.12em solid #000;border-radius:.3em;padding:.05em .35em;white-space:nowrap}
  .et-k{font-size:.7em;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  .et-nom{font-size:1.45em;font-weight:700;line-height:1.1;overflow-wrap:anywhere;margin-top:-.2em}
  .et-l{font-size:.9em;overflow-wrap:anywhere}
  .et-l span{font-weight:700}
  .et-ins{font-style:italic}
  .et-dest{border:.14em solid #000;border-radius:.35em;padding:.3em .5em;margin:.15em 0}
  .et-ciudad{font-size:1.6em;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
  .et-prov{font-size:.9em}
  .et-dir{font-size:1em;font-weight:600;overflow-wrap:anywhere}
  .et-pie{margin-top:auto;border-top:.1em dashed #000;padding-top:.3em;display:flex;justify-content:space-between;gap:.5em;font-size:.75em;font-weight:700}
  .et-vista{margin:0 auto;border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--shadow);background:#fff}
  @media print{
    html,body{background:#fff!important;overflow:visible!important}
    body>*:not(#etiquetas-print){display:none!important}
    #etiquetas-print{position:static;visibility:visible;left:auto}
    .et{break-after:page;page-break-after:always}
    .et:last-child{break-after:auto;page-break-after:auto}
  }

  @media (max-width:1100px){
    .filters{grid-template-columns:2fr 1fr 1fr 1fr}
    .filters #f-desde,.filters #f-hasta{display:none}
  }
  @media (max-width:860px){
    .top{position:static}
    .top-in{padding:8px 12px;gap:8px}
    .top .marca small{display:none}
    #b-salir{margin-left:auto}
    .tabs{order:3;width:100%}
    .tabs button{flex:1}
    .acciones{order:4;width:100%;margin-left:0;flex-wrap:nowrap}
    .acciones .btn{flex:1 1 auto;padding:6px 8px;font-size:.82rem}
    .acciones .ico{flex:0 0 auto}
    .wrap{padding:10px 12px;gap:10px}
    .stats{grid-template-columns:1fr 1fr}
    .stat{padding:6px 12px}
    .stat:nth-child(3){border-left:0}
    .stat:nth-child(n+3){border-top:1px solid var(--line)}
    .stat b{font-size:1.1rem}
    .filters{grid-template-columns:1fr auto}
    .b-filtros{display:inline-flex}
    .filters select,.filters #f-desde,.filters #f-hasta{display:none;grid-column:1/-1}
    .filters.abierto select,.filters.abierto #f-desde,.filters.abierto #f-hasta{display:block}
    .table-wrap{display:none}
    .list{display:flex}
    .kpis{grid-template-columns:repeat(3,1fr)}
    .proximo .tx{flex-direction:column}
  }
  @media (max-width:420px){
    .grid3{grid-template-columns:1fr 1fr}
    .prod{grid-template-columns:1fr 1fr}.prod .sub{grid-column:1/-1}
  }
</style>
</head>
<body>
<div id="app"><p class="empty">Cargando…</p></div>
<noscript><p style="padding:20px">Este panel necesita JavaScript.</p></noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../assets/config.js"></script>
<script src="app.js"></script>
</body>
</html>
